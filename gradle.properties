org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Gradle 性能优化
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ⚠️ AGP 9 迁移说明（2026-09-02）：
# 原先为了留在旧行为而显式写死的 android.* 开关（newDsl / builtInKotlin /
# enableAppCompileTimeRClass / usesSdkInManifest.disallowed /
# defaults.buildfeatures.resvalues / sdk.defaultTargetSdkToCompileSdkIfUnset /
# r8.optimizedResourceShrinking / uniquePackageNames）均已从 AGP 9 起翻转默认或弃用，
# 写入旧值只会产生弃用警告（AGP 10 移除），因此全部删除、采用新默认值。
# 配套改动：移除 org.jetbrains.kotlin.android 插件，改用 AGP 9 内置 Kotlin（KGP 2.2.10）。

# 以下两项是 AGP 9 中「默认值已翻转但仍受正式支持」的开关，不是弃用项。
# 主动保留 AGP 8 行为，以降低依赖解析与 R8 裁剪的回归风险：
# - useConstraints=true：沿用 8.13「所有配置间都使用依赖约束」的行为。
# - strictFullModeForKeepRules=false：保留 -keep 隐式保留默认构造函数的旧语义，
#   避免 BouncyCastle / KDBX 里靠反射实例化的类被 R8 裁掉（见 app/proguard-rules.pro）。
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# 上面两项会让 AGP 提示「建议启用 excludeLibraryComponentsFromConstraints 以提升导入性能」，
# 这里按官方提示关闭该 sync 提示（仅屏蔽提示，不改变依赖解析行为）。
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
