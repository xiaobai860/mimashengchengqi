[versions]
# AGP 9.x：新 DSL + 内置 Kotlin（KGP 2.2.10）为默认，项目已完成迁移，
# 不再使用 kotlin-android 插件。Gradle 9.5.0 / JDK 17+ / Build Tools 36。
agp = "9.3.0"
kotlin = "2.2.10"
coreKtx = "1.15.0"
documentfile = "1.1.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"

materialIconsExtended = "1.7.8"
# 1.1.0 是最后发布的稳定版（1.2.0+ 仅 alpha/beta），其 BiometricPrompt 只接受
# FragmentActivity 宿主。因此 MainActivity 继承 FragmentActivity，
# 而 SAF 文件夹选择器改用手动 startActivityForResult + 低位 requestCode，
# 以规避 FragmentActivity「requestCode 只能用低 16 位」对 Activity Result API 的限制。
biometric = "1.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# 注意：不要再加 org.jetbrains.kotlin.android（kotlin-android）——AGP 9 内置 Kotlin，
# 该插件与新 DSL 不兼容。版本仍与 AGP 内置的 KGP 保持一致（2.2.10）。
# kotlin-parcelize 同理已移除：新 DSL 下它的编译插件不生效，Parcelable 均手写。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
